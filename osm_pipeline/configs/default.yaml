# Minimal config — regenerated for GN scatter smoke test (2026-05-25).
# All values are conservative defaults; real pipeline uses auto_pipeline.py
# to materialise a city-patched copy at configs/_city_<city>.yaml.

paths:
  tile_root: output/test_conflict_suburb
  geojson_dir: output/_geojson
  fig_dir: output/_fig
  meshes_dir: output/meshes

render:
  ortho_scale_m: 512.0     # tile XY size in meters (matches auto_pipeline gsd=0.5 * size=1024)
  near_clip_m: 1.0
  far_clip_m: 5000.0
  camera_height_m: 1000.0
  image_size: 1024         # Blender topdown seg + nDSM depth output resolution (was 512 → too blurry)

tree_assets:
  dir: assets/trees
  species: []              # empty = use all *.blend in dir
  height_range_m: [4.0, 18.0]
  max_trees: 5000

osm:
  road_buffer_m:
    motorway: 9.0
    trunk: 8.0
    primary: 7.0
    secondary: 6.0
    tertiary: 5.0
    residential: 4.0
    service: 3.0
    unclassified: 4.0
    motorway_link: 6.0
    trunk_link: 5.5
    primary_link: 5.0
    secondary_link: 4.5
    tertiary_link: 4.0
    living_street: 3.5
    default: 4.0
  default_building_height_m: 9.0
  building_height_range_m: [3.0, 30.0]
  meters_per_level: 3.0
  # road_keep omitted → falls back to ROAD_HIGHWAY_KEEP default set

batch:
  stride_m: 256.0

cities: []                 # populated dynamically by auto_pipeline / UI

class_colors:
  road:     [0, 0, 255]
  water:    [0, 225, 255]
  foliage:  [0, 255, 0]
  building: [255, 0, 0]
  grass:    [128, 0, 128]
  ground:   [0, 0, 0]
